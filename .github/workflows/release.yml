name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build nevinho
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-X main.version=${VERSION}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o nevinho-linux-amd64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o nevinho-linux-arm64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o nevinho-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o nevinho-darwin-arm64

      - name: Build whisper-cli
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cd whisper.cpp
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j
          cp bin/whisper-cli ../../whisper-cli-linux-amd64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nevinho-linux-amd64
            nevinho-linux-arm64
            nevinho-darwin-amd64
            nevinho-darwin-arm64
            whisper-cli-linux-amd64
          generate_release_notes: true
